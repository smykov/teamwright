name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: make lint

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Hook regression tests
        run: make test

  # bash 3.2 is the macOS default; this catches its parser differences in a minute on Linux
  test-bash32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Tests under bash 3.2
        run: |
          docker run --rm -v "$PWD":/src:ro bash:3.2 bash -c '
            apk add -q git python3 make coreutils >/dev/null &&
            cp -r /src /w && cd /w &&
            git config --global user.email ci@example.invalid && git config --global user.name ci &&
            git config --global init.defaultBranch main &&
            bash tests/run.sh'

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # scan the whole history, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tgz
      - name: Scan the kit repository
        run: make scan
      # The kit is public; the projects it is tried on are not. PRIVATE_NAMES_RE (a repository
      # secret, so the list itself stays private) must not appear in the tree or in the recent
      # commit messages - a squash merge copies the branch's commit bodies into main.
      - name: No private project names
        env:
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }}
        run: |
          [ -n "$PRIVATE_NAMES_RE" ] || { echo "PRIVATE_NAMES_RE is not set: skipped"; exit 0; }
          found=0
          git grep -nIiE "$PRIVATE_NAMES_RE" -- . >/dev/null && { echo "::error::a private name in the tree"; found=1; }
          git log -n 30 --format=%B | grep -qiE "$PRIVATE_NAMES_RE" && { echo "::error::a private name in a recent commit message"; found=1; }
          exit $found
