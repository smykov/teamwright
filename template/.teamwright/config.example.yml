# teamwright project config - copy to .teamwright/config.yml (or let /teamwright:adopt write it).
# Schema: docs/process/plugin.md. YAML subset: maps, "- " lists, [a, b] lists, quoted strings,
# comments; no block scalars (| >) or anchors. A JSON file with the same keys also works.
version: 1
process_version: 1.0.0         # teamwright process/principles version
mode: gate-first               # gate-first (gates warn) | enforce (gates block)
areas:                         # one or more code areas; developer/test-writer roles are rendered per area
  - name: backend
    source_dirs: [backend/src]
    test_command: "npm --prefix backend test"
    lint_command: "npm --prefix backend run lint && npx --prefix backend tsc --noEmit"
    api_test_command: "npm --prefix backend run test:e2e"
    e2e_ui_command: ""
    stack: "TypeScript, Node.js"            # optional: {{STACK}}
    test_framework: "Jest + supertest"      # optional: {{TEST_FRAMEWORK}}
    test_dirs: [backend/test]               # optional: {{TEST_DIRS}}
  - name: app
    source_dirs: [app/lib]
    runner: docker                          # host (default) | docker: commands run via scripts/tw-run
    image: "ghcr.io/cirruslabs/flutter:3.38.0"   # required with docker; prefer the image CI uses
    cache: [".pub-cache"]                   # relative: kept in the container's $HOME between runs
    workdir: app                            # commands run here (repo-relative)
    test_command: "flutter test"            # bare command: placeholders render scripts/tw-run app -- ...
    lint_command: "flutter analyze"
    generate_command: "flutter gen-l10n"    # optional codegen, run before checks; checks must not modify tracked files
    generated: [app/lib/l10n/generated]     # optional: its outputs; tw-mutants copies them into a throwaway copy when its inputs are unchanged
    # generate_inputs: [app/lib/l10n]       # optional: what generate_command reads (default: the whole tree)
    # copy_env:                             # optional: environment in throwaway copies; {cache} = .teamwright/cache/<area>/copy
    #   CARGO_TARGET_DIR: "{cache}/target"
    e2e_ui_command: "patrol test"
    # ci_workflow: "windows.yml"            # optional: tests of this area that run only in CI; confirmed via a wip/<ID> push
    stack: "Dart, Flutter"
gate_command: "make check"     # aggregate gate, {{GATE_COMMAND}}; not wrapped: chain scripts/tw-run calls or a Makefile target
version_check: "GET /version returns the deployed commit"   # optional: {{VERSION_CHECK}}
verify_environments: "local, staging"                        # optional: {{VERIFY_ENVIRONMENTS}}
tools:                         # one provider per capability; "none" = no tool
  spec: spec-kit               # spec-kit | openspec | none
  context: serena              # serena | codegraph | builtin
  docs: context7               # context7 | none
  ui_verify: patrol            # playwright | patrol | flutter-integration-test | maestro | espresso-xcuitest | none
  api_verify: project-runner   # project-runner
# ui_verify_deferred: "decisions.md #6"  # owner decided: no UI verification yet (check-commands notes it)
# no_mcp: [ui_verify]          # capabilities whose tool is used without its MCP server (not added to .mcp.json)
language: en                   # language of generated project docs
process:                       # parameters of the fixed pipeline; absent keys = defaults (/teamwright:settings)
  review:
    blocking: medium           # low | medium | high: from which severity a finding returns the task
  batch:
    max_tasks: 3               # tasks per /teamwright:flow pass, one after another (1..5)
    by_priority:               # cap for a pass holding a task of this priority; the lowest wins
      P0: 1
      P1: 2
    parallel: 1                # tasks worked at once, each in its own worktree and session (1..4; /teamwright:parallel)
  autonomy:
    start: auto                # ask | auto: start the router's ready task without asking
    continue: true             # after a barrier, take the next task; push is still asked
